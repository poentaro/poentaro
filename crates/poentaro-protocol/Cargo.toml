[package]
name = "poentaro-protocol"
version = "0.1.0"
edition = "2021"
publish = false
description = "The methods an AI agent calls on Poentaro, as an anyx-protocol schema, and the server and client generated from it"

# No `[lints] workspace = true`: the code here is generated, and the
# workspace lints are for code people write.

[dependencies]
anyx-protocol = { git = "https://github.com/wongjiahau/anyx", rev = "6ad957b06ca8a53c0e1eb017990d9d2072cd30dd" }

[dev-dependencies]
anyx-protocol-generate = { git = "https://github.com/wongjiahau/anyx", rev = "6ad957b06ca8a53c0e1eb017990d9d2072cd30dd" }
