[package]
name = "poentaro-grammar"
version = "0.1.0"
edition = "2021"
publish = false
description = "The shapes a .poentaro document is made of, as an anyfix grammar, and the decoder generated from it"

# No `[lints] workspace = true`: the code here is generated, and the
# workspace lints are for code people write.

[dependencies]
anyfix-expr = { git = "https://github.com/wongjiahau/anyfix-expr", rev = "6ee981e0f245afd0c86d8e08b058925688f152e7" }

[dev-dependencies]
anyfix-generator = { git = "https://github.com/wongjiahau/anyfix-expr", rev = "6ee981e0f245afd0c86d8e08b058925688f152e7" }
