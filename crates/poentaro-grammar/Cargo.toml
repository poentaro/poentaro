[package]
name = "poentaro-grammar"
version = "0.1.0"
edition = "2021"
publish = false
description = "The shapes a .poentaro document is made of, as an anyfix grammar, and the decoder generated from it"

# No `[lints] workspace = true`: the code here is generated, and the
# workspace lints are for code people write.

[dependencies]
anyfix-expr = { git = "https://github.com/wongjiahau/anyfix-expr", rev = "2f6c4dc55057beaecac030b9342b98fdc7deb46d" }

[dev-dependencies]
anyfix-generator = { git = "https://github.com/wongjiahau/anyfix-expr", rev = "2f6c4dc55057beaecac030b9342b98fdc7deb46d" }
