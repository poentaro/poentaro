[package]
name = "poentaro-singer"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Singing itself, with the chimera voice. Without it the crate is only the
# plan types, so a build that never sings (the main wasm) doesn't carry it.
render = ["dep:chimera", "dep:flate2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chimera = { git = "https://github.com/wongjiahau/chimera-vocal-synth", rev = "955665cf59e0f66c428f363c603e2c3bb901948e", optional = true }
flate2 = { version = "1", optional = true }

[lints]
workspace = true
