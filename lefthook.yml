pre-commit:
  piped: true
  jobs:
    # Auto-fixing jobs run first, sequentially, and re-stage whatever they
    # change (stage_fixed). They must fully settle before the parallel
    # validation group below starts, since some of those jobs (e.g.
    # cargo-checks) read/compile the same files these jobs rewrite.
    - name: file-quality
      # prek runs .pre-commit-config.yaml's builtin checks against staged
      # files; its builtin hooks (trailing-whitespace, end-of-file-fixer,
      # mixed-line-ending) fix in place rather than just reporting.
      run: prek run
      stage_fixed: true

    - name: cargo-fmt
      glob: "**/*.rs"
      run: cargo fmt
      stage_fixed: true

    - name: biome-check
      glob: "web/**"
      run: cd web && pnpm exec biome check --write .
      stage_fixed: true

    # All other checks run in parallel. web-typecheck is deliberately kept out
    # of this group (and run sequentially below) because it invokes
    # `pnpm run build:wasm-component`, which runs `cargo component build` —
    # that races cargo-checks for the shared Cargo package-cache lock. The
    # full e2e suite only runs on master (last job below); CI runs it on PRs.
    - group:
        parallel: true
        jobs:
          - name: check-max-file-lines
            glob: "**/*.{rs,ts,tsx,js,jsx,py,css,html}"
            exclude:
              - "crates/poentaro-grammar/src/generated.rs"
              - "crates/poentaro-protocol/src/generated.rs"
              - "crates/poentaro-wasm/pkg/**"
              - "target/**"
              - "vendor/**"
            run: python3 scripts/check-max-file-lines.py {staged_files}

          - name: cargo-checks
            glob: "{**/*.rs,demo/**}"
            run: cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace

          - name: dead-pub-check
            glob: "{src/**,crates/poentaro-wasm/src/**,tests/**}"
            run: cargo run -p dead-pub-check --quiet

          - name: sqruff
            # Scoped to the Synced Share (Rust + D1) migration/query SQL —
            # see .sqruff for the config (SQLite dialect) and why LT01/LT02
            # are excluded. `crates/live-share-worker/queries/` doesn't
            # exist yet (lands in a later task); the glob just pre-covers
            # where those files will go.
            glob: "{live-share-worker/migrations/**/*.sql,crates/live-share-worker/queries/**/*.sql}"
            # Lint-only, not `sqruff fix`: fix reflows this SQL's
            # intentionally column-aligned trailing comments (see .sqruff).
            # `sqruff` is pinned in mise.toml (run `mise install`).
            run: sqruff lint {staged_files}

          - name: live-share-worker-wasm-check
            # Confirms the Rust Synced Share worker (`crates/live-share-worker`,
            # see `TODO-synced-share-rust-d1-migration.md` task 5) still
            # compiles for the actual Workers target. Scoped to that crate
            # so it's a no-op on unrelated commits. Deliberately just
            # `cargo check`, not the full `worker-build` bundle build:
            # `worker-build` runs a full wasm-pack-style build+bindgen
            # pipeline (and needs a separate cargo-installable tool, see
            # AGENTS.md) that's too slow for this fast parallel group
            # ([[feedback_lefthook_e2e_ordering]] — keep fast checks fast);
            # a real `worker-build` bundle verification is left as future
            # work for a CI workflow once actual deployment is being wired
            # (task 11/12), not built here.
            glob: "crates/live-share-worker/**"
            run: cargo check --target wasm32-unknown-unknown -p live-share-worker

          - name: syntax-md-examples
            glob: "{syntax.md,src/parser/**,src/desugar.rs}"
            run: python3 scripts/check-syntax-md-examples.py

          - name: web-unit-tests
            glob: "web/**"
            run: cd web && pnpm run test:unit

          - name: ast-grep-check
            glob: "web/src/**"
            run: cd web && pnpm run lint:ast-grep

    - name: web-typecheck
      glob: "{crates/poentaro-wasm/**,crates/live-share-worker/**,web/**}"
      run: cd web && pnpm run build:wasm-component && pnpm run build:worker-types && python3 ../scripts/check-wasm-size.py && pnpm exec tsc -b

    # The slowest job, so master only; CI runs the full suite on PRs.
    - name: e2e-tests
      only:
        - ref: master
      glob: "{web/src/**,web/e2e/**,crates/**,src/**}"
      run: (cd crates/live-share-worker && pnpm install --frozen-lockfile) && cd web && pnpm build:wasm-component && pnpm test:e2e:resolve

pre-merge-commit:
  jobs:
    - name: e2e-tests
      only:
        - ref: master
      run: (cd crates/live-share-worker && pnpm install --frozen-lockfile) && cd web && pnpm build:wasm && pnpm test:e2e:resolve
